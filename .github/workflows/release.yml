name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: windows-latest
            archive_ext: zip
            self_contained: 'true'
          - target: win-arm64
            os: windows-latest
            archive_ext: zip
            self_contained: 'true'
          - target: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
            self_contained: 'true'
          - target: linux-arm64
            os: ubuntu-latest
            archive_ext: tar.gz
            self_contained: 'true'
          - target: osx-x64
            os: macos-latest
            archive_ext: tar.gz
            self_contained: 'true'
          - target: osx-arm64
            os: macos-latest
            archive_ext: tar.gz
            self_contained: 'true'
          - target: freebsd-x64
            os: ubuntu-latest
            archive_ext: tar.gz
            self_contained: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Extract Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "val=${VER}" >> $GITHUB_OUTPUT

      - name: Publish Desktop Client
        run: |
          dotnet publish Client.Desktop/Client.Desktop.csproj -c Release -r ${{ matrix.target }} --self-contained ${{ matrix.self_contained }} -o out/${{ matrix.target }}

      - name: Pack Archive (Windows ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/dist
          Compress-Archive -Path out/${{ matrix.target }}/* -DestinationPath out/dist/DarkTunnel-Client-v${{ steps.version.outputs.val }}-${{ matrix.target }}.zip

      - name: Pack Archive (Linux/macOS TAR.GZ)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out/dist
          tar -czvf out/dist/DarkTunnel-Client-v${{ steps.version.outputs.val }}-${{ matrix.target }}.tar.gz -C out/${{ matrix.target }} .

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y

      - name: Build NSIS Installers (Offline & Web)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          makensis /DAPP_VERSION=${{ steps.version.outputs.val }} /DARCH=${{ matrix.target }} /DSOURCE_DIR=..\out\${{ matrix.target }} installer\setup.nsi
          makensis /DAPP_VERSION=${{ steps.version.outputs.val }} /DARCH=${{ matrix.target }} /DDOWNLOAD_URL=https://github.com/darkblue-tech/tunnel-app/releases/download/v${{ steps.version.outputs.val }}/DarkTunnel-Client-v${{ steps.version.outputs.val }}-${{ matrix.target }}.zip installer\web-setup.nsi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            out/dist/*
            out/installers/*
          if-no-files-found: ignore

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets

      - name: Extract Tag Name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "val=${TAG}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: DarkTunnel Client ${{ steps.tag.outputs.val }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            all-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
